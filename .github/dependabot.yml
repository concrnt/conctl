# version updates は minor/patch をまとめて週 1 回。major は個別 PR(auto-merge 側でラベル止まり)。
# security updates はここにグループを書いていないので従来通り個別 PR。
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    # conctl は concrnt v1.7 系の API(core / x/jwt)前提。以降の版ではこれらが消えていてグループ全体が解決不能になる
    ignore:
      - dependency-name: github.com/concrnt/concrnt
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      gomod-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
